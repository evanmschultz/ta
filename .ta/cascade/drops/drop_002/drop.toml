L1 decomposition into 2 L2 sub-planners, sequenced B-then-A.

## L2-B — ops/resolver error semantics (UPSTREAM, no blockers)

**id**: drop_002.drop.planner_l2_ops_record_not_found

**Concern**: distinguish `legitimately-absent record` from `corrupted index`; return ErrRecordNotFound for the former. Apply CENTRALLY at `resolveTypeForID` so ALL callsites with `requireType=false` inherit cleanly.

**Scope** (round-6 exhaustive enumeration of `resolveTypeForID(requireType=false)` callsites):
- internal/ops/ops.go::Get (~107)
- internal/ops/ops.go::GetAllFields (~169)
- internal/ops/ops.go::Update (~636)
- internal/ops/ops.go::deleteRecord (~937)
- internal/ops/move.go::Move (~155)

These are the 5 callsites verified at HEAD `4a05a87` per round-5 falsifier rg. `Create` (line 269) also calls resolveTypeForID but with `requireType=true`, which short-circuits the buggy branch — NOT in scope.

**Central fix site**:
- internal/ops/helpers.go::resolveTypeForID (96-120) — the bug. Empty-typeName + index miss + len(declaredTypes) > 1 must do a disk stat-and-find probe to distinguish absent-record (return ErrRecordNotFound) from on-disk-orphan (return ErrTypeUnresolved with rebuild hint). All 5 callsites above inherit cleanly.

**Error sentinel scope**:
- internal/ops/errors.go (74-77) — ErrTypeUnresolved message scoped to genuine corruption.

**Consumer-side substring-fallback safety nets**:
- cmd/ta/commands.go::isNotFound (250-263)
- internal/mcpsrv/tools.go::isMCPNotFound (406-414)

## Contract additions (rounds 1-6 cumulative)

1. **Error-string format lock — MANDATE exported constant**: L2-B MUST export a format-string constant/helper from `internal/ops/errors.go`. L2-A's tests MUST reference it directly. NO substring matching, NO hand-typed format string.

2. **Genuine-orphan regression test**: `TestOps_GetTypeUnresolvedForOnDiskOrphan` — record on disk + no index entry + multi-type db → ErrTypeUnresolved with rebuild hint.

3. **Rebuild-hint perimeter — predicate-based**: `TestRebuildHintPerimeterPredicate` with sub-assertions: (a) ErrRecordNotFound .Error() does NOT contain hint; (b) ErrTypeUnresolved DOES contain hint; (c) optional source-scan with allowlisted-function-name regex; (d) `ta get` AND `ta update` AND `ta delete` AND `ta move` of missing-id in multi-type db NOT carrying the rebuild hint (CLI-surface symmetry test — round 6 widens to 4 commands).

4. **Substring-safety-net retirement test gate**: if L2-B removes the `strings.Contains` fallback, MUST add regression tests for non-ErrRecordNotFound "not found"-substring surfaces.

5. **CLI parity for all resolveTypeForID(requireType=false) callsites** (round-6 generalization): the central fix at resolveTypeForID inherits cleanly to all 5 callsites. Required CLI regression tests:
   - `TestCLI_GetNotFoundCleanError` (no --json)
   - `TestCLI_UpdateNotFoundCleanError` (no --json)
   - `TestCLI_DeleteNotFoundCleanError` (no --json)
   - `TestCLI_MoveNotFoundCleanError` (no --json, round 6 addition)
   MCP-layer parity:
   - `mcp__ta__get` missing id → `found:false` per item.
   - `mcp__ta__update` missing id → per-item error with clean ErrRecordNotFound text (no hint).
   - `mcp__ta__delete` missing id → same.
   - `mcp__ta__move` missing src → same.

## Tests required (round-6 consolidated)

- `TestOps_GetNotFoundReturnsCleanError` — ops layer.
- `TestOps_GetTypeUnresolvedForOnDiskOrphan` — ops layer (orphan-preservation).
- `TestRebuildHintPerimeterPredicate` — with sub-assertion (d) covering get/update/delete/move CLI symmetry.
- `TestCLI_GetNotFoundCleanError`
- `TestCLI_UpdateNotFoundCleanError`
- `TestCLI_DeleteNotFoundCleanError`
- `TestCLI_MoveNotFoundCleanError`
- MCP regression: get/update/delete/move of absent id.

## Acceptance

`ta get`, `ta update`, `ta delete`, `ta move` (no --json, no --type) of a missing id in a multi-type db all return error text matching the locked ErrRecordNotFound format AND NOT containing 'ta index rebuild'. MCP equivalents: get returns `found:false`; update/delete/move return per-item error with clean text. ErrTypeUnresolved continues to fire (with rebuild hint) for on-disk orphans (locked).

## L2-A — CLI rendering surface (DOWNSTREAM, blocked on L2-B)

**id**: drop_002.drop.planner_l2_cli_error_json_render

**Concern**: every CLI error path honors `--json` matching success-path semantics.

**Scope**: cmd/ta/main.go (fang.Execute wiring) + cmd/ta/commands.go (every RunE with --json: get 114, list-sections 547, schema 1296, search 1362) + cmd/ta/commands_test.go (new tests).

**Contract addition**: L2-A's tests MUST reference L2-B's exported format constant directly. NO substring matching. NO hand-typed format string.

**Out of scope for L2-A**: mutating commands' `--json` flag extension per CLAUDE.md. The round-5/6 `TestCLI_{Update,Delete,Move}NotFoundCleanError` are L2-B tests (assert clean text, no --json), NOT L2-A tests.

**Acceptance**: every --json-flagged command emits JSON for both success AND error paths; no regression to human surface.

## Sequencing

L2-B blocks L2-A (same-package siblings + exported-constant coordination).

## Open unknowns routed to L2 planners

- L2-A: render-fork design choice.
- L2-A: JSON envelope shape.
- L2-B: keep or remove substring safety-net (contract 4).

## Plan-QA verdict trail

- Round 1 proof: READY (8/8).
- Round 1 falsification: AMEND — #3 text coord + #8 missing on-disk-orphan test.
- Round 2 falsification: AMEND — #5 OR-fork tightening + #6 perimeter open-ended.
- Round 3 falsification: AMEND — #6 enumeration empirically wrong (~10 hint sites not 3).
- Round 4 falsification: AMEND — Update + Delete CLI parity missing from scope.
- Round 5 falsification: AMEND — Move CLI parity missing (third callsite).
- Round 6 amendment: scope exhaustively enumerates all 5 resolveTypeForID(requireType=false) callsites. Methodology learning: when first naming a category, ENUMERATE ALL CALLSITES THEN list scope — else each callsite becomes its own round.

## Cascade dogfood learnings (mid-flight)

- 5 rounds of plan-QA falsification on a 2-bug slice is heavy but each round caught a SUBSTANTIVE issue — not editorial.
- The methodology IS working: every round surfaced a real gap the orchestrator would have shipped broken otherwise.
- Convergence pattern: round N+1 finds one specific issue addressing the scope/contract gap from round N. Finite enumeration (5 callsites) bounds the iteration.
- Methodology proposal: when an L1 planner identifies a class of bugs (e.g., "missing not-found error text in CLI"), the planner should enumerate ALL callsites of the root-cause function upfront, not name a representative subset. Saves rounds.
