## Dependency graph

- `L2-A` first.
- `L2-B`, `L2-C`, and `L2-D` all depend on `L2-A`.
- `L2-C` is recursive and must emit `L3-C1` + `L3-C2` before any builder dispatch.
- `L2-B` and `L2-D` are parallel-safe after `L2-A` because their path scopes are disjoint.
- `L3-C1` and `L3-C2` are parallel-safe because `drop-dashboard.astro` is reserved to `L3-C2`.

## Path overlap check

- `L2-A` owns only verifier infrastructure files: `magefile.go`, `web/templates_embed/package.json`, `web/templates_embed/playwright.config.*`, and the small FE test fixture/spec.
- `L2-B` owns only `internal/templates_html_basic/templates/schema_browser.html`.
- `L2-C` owns only thariq page files and the droplet detail route subtree.
- `L2-D` owns only `web/templates_embed/src/layouts/StilLayout.astro`.
- Recursive split inside `L2-C` is path-disjoint because `drop-dashboard.astro` belongs only to `L3-C2`; `L3-C1` owns the other four page files plus narrow regression coverage.

## Rationale

- Four L1 children still obey the parent fanout cap.
- `§3.8` is not an implementation slice; it is the L1 close bundle and stays there.
- `L2-A` had to expand beyond `magefile.go` because the committed `web/templates_embed/package.json` does not yet carry Playwright or axe dependencies, so the gate is impossible without FE substrate work.
