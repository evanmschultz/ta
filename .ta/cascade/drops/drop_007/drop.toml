description = """
drop_007 L1 plan — heading-preservation fix at md.Backend.Splice replace-existing branch.

## Bug surface (cited at file:line via Hylla)

- `internal/backend/md/backend.go:171` `(*Backend).Emit` rebuilds heading via `unslugifyForHeading(slug)` from `lastSegment(rel)` — the lossy synthesis source.
- `internal/backend/md/backend.go:229` `(*Backend).Splice` blindly replaces the whole existing section with `emitted` bytes. THIS is the branch where the authored heading is lost on body-only update.
- `internal/ops/ops.go:844` `ops.Update` drives `backend.Emit(...)` then `backend.Splice(...)`. End-to-end caller.
- Why the bug escaped existing tests: `internal/ops/ops_test.go:1743` has agents_md.section round-trip harness, but its fixture heading `"Project Specific Docs"` accidentally MATCHES the slug-title-cased fallback. New tests must use authored bytes that deliberately DIFFER (e.g. `## Project-specific docs` lowercase 's').

## Chosen approach: preserve-on-disk in Splice replace-existing branch (NOT explicit-heading-field-in-update)

Rationale:
- Keeps MCP/update contract unchanged — no new field, no schema/validation expansion for a non-declared field.
- Fixes bug at internal MD backend write path, exactly where the loss happens.
- Create-path semantics unchanged (new sections still use current slug fallback).
- Append/insert branches unchanged — only replace-existing branch modified.
- Falsification cases enumerate the bounding behavior (see Falsification section).

## Builder droplets (3 ordered)

### D1: builder-fix-md-splice-heading-preservation
- Paths: `internal/backend/md/backend.go`
- Packages: `internal/backend/md`
- Acceptance: replace-existing `Splice` preserves the original heading line bytes from `buf` and only replaces the body payload; append/insert branches remain unchanged. 1-2 small blocks.
- Test gate: `mage testFunc 'TestOps_GetUpdate_AgentsMDSectionRoundTrip|TestEmitBodyOnly'`
- Atomicity verification: localized to one function in one file; existing tests provide regression coverage during the change.

### D2: builder-test-md-update-heading-preservation
- Paths: `internal/ops/ops_test.go`, `internal/backend/md/backend_test.go`
- Packages: `internal/ops`, `internal/backend/md`
- Acceptance: add `TestMdBackend_UpdateBody_PreservesAuthoredHeadingOnMdDb` in ops_test.go using authored heading `## Project-specific docs` (deliberately differs from slug-title-cased fallback); add `TestSpliceReplaceExistingPreservesAuthoredHeadingBytes` in backend_test.go covering punctuation/case preservation; sibling bytes byte-identical after splice. 1-2 small blocks per droplet.
- Test gate: `mage testFunc 'TestMdBackend_UpdateBody_PreservesAuthoredHeadingOnMdDb|TestSpliceReplaceExistingPreservesAuthoredHeadingBytes'`
- Ordering: MUST run after D1.

### D3: builder-fuzz-md-heading-preservation (optional)
- Paths: `internal/backend/md/fuzz_test.go`
- Packages: `internal/backend/md`
- Acceptance: extend fuzz so replace-existing splice preserves the original heading line byte-for-byte while varying body text and authored heading punctuation/case; create-path behavior remains outside this assertion. 1 small block.
- Test gate: `mage testFunc 'Fuzz.*Md.*Heading.*'`
- Ordering: after D1; content-independent of D2 but same package, keep sequential.

## Falsification cases the fix must respect

- Case 1 (target): replacing an existing section preserves heading line bytes; only body bytes change.
- Case 2 (untouched): creating a missing section continues to use current slug-derived heading synthesis.
- Case 3 (untouched): inserting a missing child under an existing parent remains unchanged.
- Case 4 (untouched): sibling sections and trailing content remain byte-identical outside the replaced range.

## Expected outputs

- `drop_007.drop.builder_fix_md_splice_heading_preservation` (cascade.droplet)
- `drop_007.drop.builder_test_md_update_heading_preservation` (cascade.droplet)
- `drop_007.drop.builder_fuzz_md_heading_preservation` (cascade.droplet, optional)
- Per F23 v2, each droplet auto-spawns its qa_proof + qa_falsification twins on create.

## Reuse discovery

- Existing agents_md.section round-trip harness at `internal/ops/ops_test.go:1743`.
- Existing backend test surface at `internal/backend/md/backend_test.go:305`.
- Existing fuzz surface at `internal/backend/md/fuzz_test.go:186`.

## Unknowns routed forward

- Exact `mage testFunc` invocation name for the fuzz target was not confirmed against magefile.go in this dispatch — builder verifies before adding.
- No additional surface in `internal/backend/md/` is suspected; if D1 builder finds additional Splice call-sites that copy emitted bytes verbatim, escalate before broadening the fix.
"""
