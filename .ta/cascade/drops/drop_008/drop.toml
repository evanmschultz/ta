## Dependency graph

- All 4 of L2-A, L2-B, L2-C, L2-E are parallel-safe (per round-1 falsif: committed cmd/ta code does NOT require A-first sequencing; internal/server + internal/serverview are NEW packages with no dependency on the cobra subcommand existing first).
- Then: `drop_008.drop.planner_l2_d_ta_serve_integration` after both `L2-B` and `L2-C` (D's httptest needs server + view to compile).
- Browser/axe verification inside `L2-D` remains blocked by `drop_009`.

## Path overlap check

- `L2-A` owns only `cmd/ta/**` serve-subcommand files plus the one required `cmd/ta/main.go` registration edit.
- `L2-B` owns only `internal/server/**`.
- `L2-C` owns only `internal/serverview/**`.
- `L2-D` owns only `internal/servee2e/**`.
- `L2-E` owns only `magefile.go` and `docs/ta-serve*.md`.
- No path glob overlaps remain across siblings.
- Package overlap is also removed except for `L2-E`, which is intentionally non-Go support-only and therefore does not contend with builder package locks.

## Rationale

- The handoff’s likely split (command, routes, live reads/render, tests, docs) is preserved, but the runtime half is split into a route package and a view package so `L2-B` and `L2-C` can actually run in parallel without sharing files or packages.
- A separate support slice is justified because `magefile.go` and docs do not belong inside the runtime packages, and forcing them into `cmd/ta` or `internal/server` would violate path isolation.
- No L2 exceeds six droplets, so no L3 recursion is required on this pass.

## Unknowns routed forward

- Tillsyn project bootstrap gap: `till_project list` did not show a dedicated ta project. Coordination should decide whether that setup is needed before downstream implementation/QA begins.
- Exact existing Track A template filename mapping for every cascade record kind beyond the currently committed render tests should be rechecked by `L2-C`; if a route needs a new template name, the child planner must mark it `new, not yet in tree` rather than assume it already exists.
- Track B `/embed/*` serving in HANDOFF §4.1 is acknowledged, but this L1 plan intentionally keeps first-pass implementation centered on the live `.ta` cascade browser plus a support-note in `L2-E`; if the child planners find that `/embed/*` needs a distinct package or more than six droplets, they must recurse before builder dispatch.
- Playwright + axe verification is explicitly dependent on drop_009; `L2-D` must not claim browser evidence before that substrate exists.

