[ta_serve_cascade_browser]
acceptance_criteria = "1. cmd/ta + internal/server (or equivalent) cleanly separated. 2. No client-side JS required for navigation. 3. Search returns relevant records via mcp__ta__search (or in-process equivalent). 4. Each route returns deterministic HTML for snapshot testing. 5. No semver phrasing in plan content. 6. Builder droplets each ≤2 small code blocks INCLUDING tests. 7. L1 plan-QA twins pass before descent."
blockers = ["drop_010.drop.pivot_cleanup_thariq_examples_retire_track_b"]
created_at = "2026-05-21T03:55:00Z"
created_by_actor = "user:ev+orchestrator"
created_by_type = "user"
definition_of_complete = "1. `ta serve [--port N] [--bind ADDR]` cobra subcommand exists (default 127.0.0.1:4321). 2. HTTP handler reads live .ta/ substrate via internal/ops (cascade.* + roadmap.* + any other db). 3. Routes: `/` cascade tree overview, `/cascade/<id>` record detail, `/roadmap`, `/schema`, `/search?q=...` pure-server full-text. 4. Renders via internal/templates_html_basic (Track A) at RUNTIME, not static dist. 5. Zero-JS navigation: descendant rows + sidebar items + record drilldown all use native links. 6. Integration tests via httptest + Playwright (relies on drop_009 Playwright infra). 7. axe-core a11y pass on every served page (relies on drop_009 mage TemplatesA11y gate). 8. `mage Serve` wrapper target + docs. 9. mage check green."
drop_number = 8.0
files = ["cmd/ta/serve_cmd.go", "internal/server/**", "internal/templates_html_basic/templates/**", "magefile.go"]
labels = ["mvp-primary", "ta-serve", "go-backend", "http", "post-pivot"]
objective = "Ship `ta serve` subcommand that reads live `.ta/` records via internal/ops and serves HTML at runtime using Track A templates (internal/templates_html_basic). Pure-server, zero-JS. This is the NEW primary mvp-feature-complete target after the 2026-05-21 pivot (drop_005 superseded). Per HANDOFF §4."
packages = ["cmd/ta", "internal/server", "internal/ops", "internal/templates_html_basic", "magefile"]
