- final location unresolved until drop_010 lands
Notes:
- Final file concretization must replace `<a11y test root>` everywhere once drop_010 closes.
- The Playwright spec tree is intentionally reserved to infra ownership so the Track A contrast slice does not need to touch FE test paths.

## L2-B

Proposed id: `drop_009.drop.planner_l2_b_track_a_schema_browser_contrast`
Title: `L2-B planner — Track A schema-browser optional-pill contrast`
Objective: remediate the `.pill[data-value="false"]` contrast failure in `internal/templates_html_basic/templates/schema_browser.html` with a CSS/markup-local change and a Go-side regression test that stays inside the Track A package boundary.
Definition of complete:
- `internal/templates_html_basic/templates/schema_browser.html` raises the optional-pill false-state contrast to AA (`4.5:1`) without introducing JS, hydration, or layout churn outside the affected token/selector area.
- A Go regression test is added in the Track A package boundary, using an honest name in the shape `TestTrackA_AsHtml_PillContrastOnSchemaBrowser` (or a strictly equivalent honest variant), so the regression does not share FE spec paths with L2-A.
- The resulting template remains responsive and semantically unchanged across the planned viewport set `375`, `768`, and `1280`; this slice does not introduce any client-side behavior.
Acceptance criteria:
- Owns parent DoC item 5, plus the Track A half of item 6's honest naming requirement.
- No overlap with the verifier substrate paths; regression coverage stays in `internal/templates_html_basic` rather than `<a11y test root>/tests/a11y/**`.
- CSS-first remediation only: token, color, or markup-local change in the existing template; no JS-based workaround.
- Verification planning names the narrow package gate first and the downstream a11y gate second.
Paths globs:
- `internal/templates_html_basic/templates/schema_browser.html`
- `internal/templates_html_basic/**/*_test.go`
Packages:
- `internal/templates_html_basic`
Expected droplet count:
- `2`
Atomicity verification:
- D1 contrast-token / selector adjustment in `schema_browser.html` only.
- D2 Go regression test only.
- Each droplet stays within 1-2 small code blocks INCLUDING tests.
Verification gates:
- Narrow: `mage testPkg ./internal/templates_html_basic`
- Downstream close gate: `mage TemplatesA11y`
Depends_on:
- `drop_009.drop.planner_l2_a_playwright_axe_templates_a11y` for final closeout, but not for local CSS/test implementation
Blockers:
- none once L2-A substrate exists
Notes:
- The current evidence shows the failing selector is `.pill[data-key="required"][data-value="false"]` using `--optional-bg` / `--optional-fg`; this L2 owns that pair and any equivalent markup-local remediation.

## Dependency graph

- External blocker first: `drop_010.drop.pivot_cleanup_thariq_examples_retire_track_b` resolves `<a11y test root>`.
- `L2-A` is the first internal planner because it owns the reusable gate and the final `mage check` closure.
- `L2-B` is implementation-parallel in principle for the template and Go regression, but it cannot claim full closeout until `L2-A` lands and `mage TemplatesA11y` exists.
- `drop_008.drop.ta_serve_cascade_browser` is a consumer dependency for the served-page half of the L2-A spec.

## Path overlap check

- `L2-A` owns only `magefile.go` and the generic a11y test root (`package.json`, `playwright.config.*`, `tests/a11y/**`).
- `L2-B` owns only `internal/templates_html_basic/templates/schema_browser.html` and Go tests under `internal/templates_html_basic/**/*_test.go`.
- No path glob overlaps.
- No shared style-layer ownership: L2-B changes Track A template-local CSS only; L2-A changes verifier substrate only.

## Rationale

- Two L2s are sufficient because there are only two real write domains after the pivot: verifier substrate/wiring and Track A template remediation.
- A separate integration L2 would be artificial. The integration point is already load-bearing within `L2-A` because `magefile.go` and the Playwright root must converge in the same close condition.
- Keeping the Track A regression inside the Go package avoids the common overlap failure where both planners claim `tests/**/*.spec.*` under the FE root.
- This split preserves atomic droplets: `4` droplets for substrate/wiring and `2` droplets for the contrast slice.

## Unknowns routed forward

- drop_010 decides the final concrete location for Playwright config, dependencies, and specs. Until then this plan intentionally uses `<a11y test root>` placeholders.
- drop_008 decides which representative `ta serve` routes exist first; L2-A must pin one committed route, not invent one.
- This dispatch did not expose plain repo-local `Read` / `Grep` / `Glob`; repo inspection used ta records, Hylla, and GitHub-backed file fetch instead. If the orchestrator wants stricter local-tree discovery before L2 descent, it should expose those read tools.

## expected_outputs rationale

The orchestrator should create one L2 planner record and two plan-QA twin records per L2.
