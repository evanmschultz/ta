created_at = "2026-05-22T23:59:00Z"
definition_of_complete = "This L1 record contains 4 concrete builder droplet specs with verified existing target functions, verified existing file paths, explicit package/path ownership, acceptance criteria, mage testFunc targets, and per-droplet atomicity attestations. Section 0 reasoning is not copied into the record."
description = """
Committed-source evidence used for this decomposition:
- `cmd/ta/commands.go::readJSONData` has four concrete non-TUI branches: inline JSON, missing-source error, `--data-file -` stdin read, and file read. Existing `cmd/ta/commands_test.go` already carries reusable fixture idioms (`newSchemaFixture`, direct helpers).
- `cmd/ta/create_cmd.go::collectCreateData` is the create-side non-TUI entrypoint. Its reachable non-TUI surface is the `--data/--data-file` branch, JSON parse failure, and off-TTY polite error; the interactive form branch is intentionally out of scope per parent drop guidance.
- `cmd/ta/delete_cmd.go::runDeleteSingle` has three non-TUI branches still worth targeting: formatted pre-echo failure aborts delete, immediate success path when delete does not require confirm, and non-TTY propagation of `ops.ErrFileDeleteRequiresForce`.
- `cmd/ta/get_cmd.go::runGetSingleWithFormat` is the largest remaining non-TUI helper in the package slice. Existing `cmd/ta/get_cmd_test.go` already covers mismatch/template happy paths, but committed code still exposes uncovered early-return and output-shape branches (`--fields` incompatibility, relative `--template` path handling, `--json` envelope) that are reachable without teatest.

Coverage projection against the parent drop's current gap (~39 blocks to reach 70%):
- D1 `readJSONData`: likely +5 to +7 blocks because two switch arms and the no-source error are currently under-covered from a 33.3% baseline.
- D2 `collectCreateData`: likely +7 to +9 blocks because the non-interactive success/error branches are reachable while the TUI branch remains deliberately untested.
- D3 `runDeleteSingle`: likely +8 to +10 blocks because the non-TTY success/error split and strict `--as` abort path exercise most remaining branch surface from a 52.6% baseline.
- D4 `runGetSingleWithFormat`: likely +14 to +18 blocks because the function is materially larger and still has uncovered non-TUI control-flow arms despite existing mismatch tests.
- Aggregate estimate: roughly +34 to +44 blocks, with D4 load-bearing. This is sufficient enough to justify a 4-droplet pass; if the final measure still lands below 70%, the next fallback target should be `cmd/ta/get_cmd.go::runGetScope` or `::runGetGroup`, but that contingency is intentionally not emitted in this pass.

Ordering constraint:
- All droplets touch distinct test files, but they all share package `cmd/ta`. Per planner package-lock discipline, dispatch SERIALIZED: D1 -> D2 -> D3 -> D4.

L1 decomposition:

D1. `drop_013.drop.builder_d1_read_json_data`
- Path: `cmd/ta/commands_test.go`
- Package: `cmd/ta`
- Target function: `cmd/ta/commands.go::readJSONData` (verified existing)
- Objective: add direct branch tests for inline payload, `-` stdin payload, file payload, and the missing-source error so `readJSONData` no longer depends on incidental coverage through higher-level commands.
- Evidence anchor: committed `readJSONData` is a four-arm helper with no TUI dependency; it is currently listed by the parent drop at 33.3% coverage.
- Suggested tests: `TestReadJSONData_Branches` (new, not yet in tree) and, only if needed for readability, `TestReadJSONData_MissingSource` (new, not yet in tree).
- Builder verification target: `mage testFunc 'TestReadJSONData_'` with `TA_TEST_PKG=./cmd/ta`.
- Definition of complete: the new tests hit the inline, stdin, file, and error branches; no production code changes; `cmd/ta/commands_test.go` remains the only touched file.
- Atomicity verification: one small test block is enough; an optional tiny helper inside the same file keeps the droplet at ≤2 small blocks INCLUDING tests.
- Blocker: none.

D2. `drop_013.drop.builder_d2_collect_create_data`
- Path: `cmd/ta/create_cmd_test.go`
- Package: `cmd/ta`
- Target function: `cmd/ta/create_cmd.go::collectCreateData` (verified existing)
- Objective: cover the non-TUI create data flow directly: valid inline/file JSON success, invalid JSON parse failure, and off-TTY no-input error. Do not attempt the interactive form branch.
- Evidence anchor: committed `collectCreateData` first delegates to `readJSONData`, then `json.Unmarshal`, then emits the explicit off-TTY diagnostic when no input flags are supplied. This is the reachable non-TUI surface behind the parent drop's 47.1% coverage figure.
- Suggested tests: `TestCollectCreateData_InlineAndFileSuccess`, `TestCollectCreateData_InvalidJSON`, and `TestCollectCreateData_OffTTYRequiresInput` (all new, not yet in tree).
- Builder verification target: `mage testFunc 'TestCollectCreateData_'` with `TA_TEST_PKG=./cmd/ta`.
- Definition of complete: tests prove the returned map on success and the exact error-shape classes on invalid JSON and off-TTY missing-input; no new helper outside `cmd/ta/create_cmd_test.go`.
- Atomicity verification: one compact fixture/helper block plus one test block keeps this droplet within the 1-2 small-block limit INCLUDING tests.
- Blocker: `drop_013.drop.builder_d1_read_json_data` (package serialization only).

D3. `drop_013.drop.builder_d3_run_delete_single`
- Path: `cmd/ta/delete_cmd_test.go`
- Package: `cmd/ta`
- Target function: `cmd/ta/delete_cmd.go::runDeleteSingle` (verified existing)
- Objective: cover the non-interactive branches that existing command-level tests do not pin directly: strict `--as` pre-echo failure aborts before delete, successful non-confirm delete emits the notice path, and non-TTY `force=false` propagates the file-delete-requires-force error without deleting.
- Evidence anchor: committed `runDeleteSingle` first routes optional formatted pre-echo, then calls `runDelete`, then either emits the notice or falls into TTY confirm only on `ops.ErrFileDeleteRequiresForce`. The parent drop lists it at 52.6% coverage.
- Suggested tests: `TestRunDeleteSingle_AsPreEchoFailurePreservesRecord`, `TestRunDeleteSingle_SuccessWithoutConfirm`, and `TestRunDeleteSingle_NonTTYRequiresForce` (all new, not yet in tree).
- Builder verification target: `mage testFunc 'TestRunDeleteSingle_'` with `TA_TEST_PKG=./cmd/ta`.
- Definition of complete: tests assert both return/error behavior and record-preservation side effects where relevant; only `cmd/ta/delete_cmd_test.go` is touched.
- Atomicity verification: existing delete fixtures already exist in-file, so this remains a single test block or, at most, one tiny direct-call helper plus tests; still ≤2 small blocks INCLUDING tests.
- Blocker: `drop_013.drop.builder_d2_collect_create_data` (package serialization only).

D4. `drop_013.drop.builder_d4_run_get_single_with_format`
- Path: `cmd/ta/get_cmd_test.go`
- Package: `cmd/ta`
- Target function: `cmd/ta/get_cmd.go::runGetSingleWithFormat` (verified existing)
- Objective: target the largest remaining non-TUI helper branch surface in `cmd/ta`: reject `--fields` combined with `--as/--template`, prove the relative-template-path branch joins against project root, and prove the `--json` output path emits the single-record envelope.
- Evidence anchor: committed `runGetSingleWithFormat` has explicit early-return logic for `fields`, explicit relative-path handling for `templateView`, and a dedicated `asJSON` emission branch. Existing committed tests cover mismatch and happy-path template composition but not these three control-flow arms; the parent drop still lists the function at 68.3% coverage.
- Suggested tests: `TestRunGetSingleWithFormat_RejectsFieldsWithAsOrTemplate`, `TestRunGetSingleWithFormat_RelativeTemplatePath`, and `TestRunGetSingleWithFormat_AsJSONEnvelope` (all new, not yet in tree).
- Builder verification target: `mage testFunc 'TestRunGetSingleWithFormat_'` with `TA_TEST_PKG=./cmd/ta`.
- Definition of complete: tests cover the early incompatibility error, the relative path normalization path, and the JSON envelope output; no production code edits; only `cmd/ta/get_cmd_test.go` is touched.
- Atomicity verification: existing get fixtures already exist in-file, so one new helper at most plus 2-3 focused tests keeps the droplet within the 1-2 small-block limit INCLUDING tests.
- Blocker: `drop_013.drop.builder_d3_run_delete_single` (package serialization only).
"""
