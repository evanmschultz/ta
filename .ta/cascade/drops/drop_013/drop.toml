[planner_l1_cmd_ta_coverage_70]
acceptance_criteria = "1. Four builder droplets, each scoped to one existing cmd/ta target function and one existing test file. 2. Every droplet remains ≤2 small code blocks INCLUDING tests; any needed helper inside the same test file counts toward that budget. 3. Because all droplets share package cmd/ta, they dispatch in explicit serial order despite disjoint file paths. 4. The projected combined gain is low-40s blocks, which is sufficient to close the current ~39-block gap to 70%."
