## Cross-droplet file/blocking notes
- D0 is the prerequisite substrate for any real partial inclusion. No builder droplet may claim sidebar wiring before D0 lands.
- D3 is the single owner of graph-edge semantics. D5 and D6 consume its contract; they do not infer hierarchy ad hoc.
- `internal/serverview/render.go` now serializes D6 -> D7 -> D9 -> D10b.
- `internal/templates_html_basic/render_test.go` and `internal/templates_html_basic/testdata/` serialize D7 -> D8 -> D9 -> D10a.
- D10a is the only owner of the not-found template + golden assets; D10b is the only owner of the cascade-detail missing-id route + renderer wiring.
- D10b explicitly blocks on D10a so route/render retrofit cannot land before the template exists.
- No droplet is allowed to add JS or a hydrated island. Every interactive surface in this plan remains server-rendered; no client-state justification is needed because no new island is permitted.

## Verification gates and routed unknowns
- Slice gates: `mage testPkg ./internal/serverview` for D3-D7 plus D9-D10b, `mage testPkg ./internal/templates_html_basic` for D0-D2 and D6-D10a, and `mage testPkg ./internal/server` for D10b's route-package compile gate.
- The named a11y gate remains post-build QA work: `mage TemplatesA11y` plus the existing Playwright + axe path against `./bin/ta serve`.
- Orchestrator/module gate remains `mage check` after the build wave and both build-QA passes.
