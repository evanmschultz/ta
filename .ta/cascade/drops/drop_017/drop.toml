## Verdict

**PASS-WITH-FINDINGS** — decomposition into D1/D2/D3 is well-formed (atomicity within budget, symbols correctly grounded, merge expression pinned). One **CRITICAL** finding: D3 acceptance bullet #4 (Validation gate) describes an unachievable test under the current Validate implementation. Two NITs (LOC borderline on D3, empty-projectPath unspecified).

## Atomicity Measurement (per droplet)

- **D1 builder_l2a_loader_user_override**: 1 new production symbol (LoadUserOverride). Files: load.go + load_test.go (2). Estimated LOC: ~12 fn body + 4 test cases × ~12 = ~60 LOC. **WITHIN BUDGET.**
- **D2 builder_l2a_loader_project_override**: 1 new production symbol (LoadProjectOverride). Files: load.go + load_test.go (2). Estimated LOC: ~12 fn body + 4 test cases × ~12 = ~60 LOC. **WITHIN BUDGET.**
- **D3 builder_l2a_loader_merged**: 1 new production symbol (LoadMerged). Files: load.go + load_test.go (2). Estimated LOC: ~20 fn body (6 steps + 4 error wraps) + 5 test cases × ~15 = ~95 LOC. **BORDERLINE — projected ~95 LOC vs ≤80 budget.** Test-case consolidation via subtests + shared fixture helpers can plausibly land at ≤80; flag as a builder-discretion risk, not a hard FAIL.

## Critical Findings

### CRITICAL-1: D3 acceptance bullet 4 ("Validation gate") is unachievable with current Validate implementation

D3 spec demands:
> "Validation gate: if user override declares a substrate with empty Source, the merged result fails Validate and LoadMerged returns an error."

**Counterexample:** LoadUserOverride internally calls LoadBytes → Validate per validate.go:42-47 (`validateSubstrate` rejects any substrate with empty Source). Therefore:
1. User override TOML with empty Source: `LoadUserOverride` returns error at LoadBytes-time, never reaches LoadMerged's post-merge Validate. The error path D3 returns is `"installconfig: load merged: user override: %w"`, not `"installconfig: load merged: validate: %w"`.
2. User override TOML with valid Source + Destination: passes LoadBytes Validate, gets merged (mergeSubstrate fills empty fields from defaults but never clears user's non-empty fields — see internal/installconfig/merge.go:38-63), result still passes Validate.
3. Merging two individually-valid Configs cannot produce an invalid merged Config under the current per-substrate-only Validate semantics — Validate has no cross-substrate constraints.

**Therefore the "validation gate" test cannot be constructed.** The builder will either:
(a) write a misleading test that re-proves LoadBytes' gate via a different call path,
(b) silently drop the case,
(c) escalate back to planner.

This is a **PLANNER DEFECT** — the L2-A planner accepted L1 parent's `acceptance_criteria` bullet "Validation runs on merged result" without auditing whether the gate can fire under the current Validate. The post-merge Validate call is structurally defensive but practically untestable.

**Suggested fix**: rewrite D3 bullet 4 to acknowledge the structural-but-untestable nature:
> "Defensive Validate: LoadMerged calls Validate on the merged Config as a structural gate. Under the current per-substrate-only Validate semantics this gate cannot fire from individually-valid inputs; document this in a doc-comment on LoadMerged. No test case is required."

OR add a cross-substrate Validate rule first (out of L2-A scope; would require its own droplet).

## NITs

### NIT-1: D3 LOC budget is borderline

Five acceptance cases (ADD/CHANGE/project-beats-user/validation-gate/missing-overrides) plus the function body project ~95 LOC. Within reach of ≤80 via subtest-table compression + shared `mkProjectDir(t, body string)` helper, but the builder must consciously compress. Note in D3 description that subtest tables are expected.

### NIT-2: `os.IsNotExist` vs `errors.Is(err, os.ErrNotExist)` idiom inconsistency

D1 + D2 specs say `if os.IsNotExist(err) is true, return (Config{}, nil)` — the legacy idiom. The existing `internal/installconfig/load_test.go:170` comment on `TestLoadFile_ReadsFromDisk` says "with a wrapped `%w` chain so callers can errors.Is on os.ErrNotExist". Modern Go (1.13+) prefers `errors.Is(err, os.ErrNotExist)`. Both work but the spec should pick the modern idiom for consistency with the documented contract.

### NIT-3: Empty-projectPath handling unspecified

D2 spec: `filepath.Join(projectPath, ".ta", "install.toml")`. With `projectPath = ""`, `filepath.Join` returns `".ta/install.toml"` — relative, reads from CWD. The spec does not pin behavior for empty projectPath. Plausibly a consumer concern (L2-B planner_l2_install_consumers), but D2/D3 should at least acknowledge that empty projectPath silently reads from CWD or add a `projectPath == ""` guard.

## Attack Vectors Tried

1. **Atomicity measurement** — D1/D2 well within budget; D3 borderline → NIT.
2. **Scope coverage** — All L1 parent acceptance bullets mapped to D1/D2/D3 acceptance criteria → MITIGATED.
3. **Symbol grounding (Hylla + family check)** — confirmed absent: LoadUserOverride/LoadProjectOverride/LoadMerged. Confirmed present with correct signatures: LoadFile, LoadBytes, Defaults, MergeDefaults, Validate, mergeSubstrate. `errors.Is(err, os.ErrNotExist)` family idiom inconsistency → NIT.
4. **Seam TODO hunt** — read load.go/merge.go/validate.go/defaults.go/config.go/load_test.go/merge_test.go end-to-end: no TODO/DEFERRED/FIXME comments. Clean → MITIGATED.
5. **Path resolution attack** — `filepath.Join` semantics correct (Clean is implicit), but empty-projectPath edge case unspecified → NIT.
6. **N3 expression check** — `proj.MergeDefaults(user.MergeDefaults(*def))` pinned verbatim with "EXACTLY this expression" and variable names pinned → MITIGATED.
7. **N4 test surface** — ADD-case + CHANGE-case explicitly named in D3 acceptance bullets → MITIGATED.
8. **MergeDefaults semantics edge** — verified via merge.go: receiver wins per-field when non-zero; defaults fill zero-fields. ADD-case and CHANGE-case both correctly modeled → MITIGATED.
9. **Validate-after-merge** — D3 step 5 explicitly calls Validate(merged); but **the test case demanded is unachievable** → see CRITICAL-1.

## Hylla Feedback

