## Plan-QA Falsification — drop_017 L1 decomposition

### Verdict: PASS-WITH-FINDINGS

No unmitigated counterexample found. One soft critical-leaning FINDING + two NITs. Plan is safe to advance into L2 dispatch.

### Attack Vectors

1. Atomicity MEASUREMENT (the 3 L1 children) → MITIGATED.
   - Loader L2 + Consumer L2 are `kind=segment`/`role=planner` (sub-planners, not droplets — the ≤2-symbol/≤80-LOC/≤3-file cap applies to their projected droplets, not to themselves).
   - README builder droplet: 0 production symbols, 1 file (README.md), ≤80 LOC (layering doc + one example). Within budget.

2. SCOPE coverage (acceptance_criteria + def-of-complete) → MITIGATED.
   - All 6 acceptance_criteria bullets are covered across the 3 children.
   - All 6 def-of-complete bullets are covered. Bullet 4's reference to `cmd/ta/install_cmd.go` is correctly handled by consumer-L2's explicit guard against creating the stale file.
   - NIT (V2): acceptance_criteria #5 says overrides can ADD substrates OR CHANGE existing fields. Loader-L2 explicitly tests precedence (which exercises CHANGE via MergeDefaults' field-level semantics) but does not call out a CHANGE-specific test case. Soft NIT — the existing merge_test.go already covers field-level merge semantics; LoadMerged tests just inherit precedence coverage.

3. SYMBOL grounding → PASS.
   - LoadFile (load.go:13), LoadBytes (load.go:25), Defaults (defaults.go:23), Config.MergeDefaults (merge.go:18), Validate (validate.go), applyRegistrations (install.go:304), ApplyRegistrations (called at install.go:328) ALL verified by direct Read at HEAD 7a589af.
   - internal/config.SchemaDirName = ".ta" — verified consistent with corroborating evidence (entire codebase uses `.ta/` directory convention).
   - LoadUserOverride / LoadProjectOverride / LoadMerged correctly tagged NEW.

4. BLOCKER soundness → FINDING (soft-critical).
   - `planner_l2_install_consumers.blockers = ["drop_017.drop.planner_l2_installconfig_override_loaders"]` places the dependency on the PLANNER NODE, not on its projected build droplets. Per CLAUDE.md cascade methodology §4: "`blocked_by` ON A PLAN NODE GATES ITS BUILDS, NOT ITS DECOMPOSITION. Decomposition is read-only design — a planner decomposes against a dependency's spec'd shape and marks its build droplets `blocked_by`; only the builders wait on the built symbol. Sibling sub-planners launch as soon as their parent's plan-QA is green."
   - The consumer L2 sub-planner CAN decompose in parallel against the loader L2's spec'd API (LoadUserOverride/LoadProjectOverride/LoadMerged with full semantics described in the loader-L2 record). The blocker should sit on consumer-L2's projected L3 build droplets, not on the consumer-L2 sub-planner node itself.
   - Mitigation: in practice the orchestrator may serialize anyway (the wall-clock cost is small), and the consumer L2 record itself is well-grounded against the loader's spec'd shape. SOFT FINDING — recommend either (a) moving the blocker to consumer-L2's L3 droplets when emitted, or (b) reinterpreting the blocker as "block decomposition until loader-L2's plan-QA is green" (which is consistent with sibling-sub-planner sequencing).
