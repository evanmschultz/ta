   - Mitigation: builders reach actual decomposition through L3 droplets emitted by consumer L2, not through root paths list. Root `paths` slice should ideally be updated to remove the nonexistent file, but the behavioral risk is low. NIT.

6. D5 regression risk (applyRegistrations projectRoot resolution) → MITIGATED.
   - Loader L2 does NOT touch internal/install/install.go.
   - Consumer L2 paths include internal/install/install.go BUT spec explicitly says: "Existing internal/install.applyRegistrations contract is preserved: it already accepts projectRoot and resolves relative Registration.SettingsFile against projectRoot at HEAD 7a589af; do not regress this." D5 invariant explicitly called out as load-bearing.

7. Hidden dependencies (MergeDefaults composition + empty-layer edge cases) → MITIGATED with soft sub-planner NIT.
   - Verified merge.go directly: MergeDefaults handles empty layers cleanly (nil receiver or nil-Substrates arg both compose without panic; result is whichever non-empty layer survives).
   - 14-substrate defaults map verified in defaults.toml (planner says "14 substrates" which matches the actual file count; the file's header comment legacily says "12 substrates" but the body contains 14 entries — substrates 13 and 14 are example_thariq + example_stil, both within the same map type so MergeDefaults handles them uniformly).
