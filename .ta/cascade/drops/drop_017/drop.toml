## Verdict: FAIL

L2-B's D2 droplet has a load-bearing flaw: the `--path` flag name collision between `resolveCLIPath` and `newTemplateSaveCmd`'s substrate `--path` flag. Falsifies the planner's claim that 'existing tests pass without behavioral change'.

## Critical Findings

### CRIT-1 (FAIL): D2 — resolveCLIPath collides with substrate --path flag

D2 spec says: `projectPath := resolveCLIPath(c)` in the RunE closure of `newTemplateSaveCmd`. Evidence collected:

- `cmd/ta/path.go` line 14: `const pathFlagName = "path"`. `resolveCLIPath(cmd)` reads `cmd.Flags().GetString(pathFlagName)` — i.e. the flag literally named `--path`.
- `cmd/ta/template_cmd.go` line 478: `cmd.Flags().StringVar(&path, "path", "", "source file path (required for kind=agent|config|docs-template or substrate)")`. The substrate save command's `--path` flag is the SOURCE FILE PATH, NOT the project path. `newTemplateSaveCmd` does NOT use `addPathFlag(cmd)` — `init_cmd.go` does (line 167), but template-save manually registers `--path` for source-file semantics.
- Result: `resolveCLIPath(c)` returns the absolute source-file path, not a project path. `installconfig.LoadProjectOverride(projectPath)` then does `filepath.Join(projectPath, ".ta", "install.toml")` → `<source-file>/.ta/install.toml` (nonsensical: a file has no `.ta/` subdir). `os.ReadFile` on that path returns a `*PathError` wrapping `syscall.ENOTDIR`. `os.IsNotExist` does NOT match ENOTDIR per longstanding Go behavior (golang/go#18974), so `LoadProjectOverride` returns a real error, NOT graceful empty Config.
- Test fallout: ALL THREE tests in `cmd/ta/template_save_substrate_test.go` pass `--path` with an absolute source-file path (line 76, 153, 224). Every test would fail with `templates: load merged config: installconfig: load merged: project override: installconfig: read "<tmpfile>/.ta/install.toml": not a directory`.
- Planner's claim: "Because tests do not pass `--path`, `resolveCLIPath` returns the cwd. The cwd in tests has no `.ta/install.toml`, so LoadMerged returns defaults — no behavioral change. Tests should compile and pass without modification." THIS IS FACTUALLY WRONG. Every test passes `--path` with the source-file path; the cwd-fallback branch in `resolveCLIPath` is never hit.

**Mitigation paths** (planner picks one):
1. Rename the substrate save command's `--path` flag (e.g. `--source` for the source file) and reserve `--path` for `addPathFlag`. This is a USER-FACING flag rename — needs root-drop sign-off.
2. Add a separate `--project-path` flag in `newTemplateSaveCmd` (uses a different flag name in `resolveCLIPath`-like helper).
3. Pass projectPath via `os.Getwd()` directly in D2 (give up the --path flag for substrate-save's project context and document the limitation).
4. Refactor `runTemplateSaveSubstrate` to accept `*cobra.Command` (or `projectPath` resolved by a different path) and add an explicit project-path resolver that DOESN'T collide with `pathFlagName`.

Until the planner picks a mitigation and re-spec's D2, the plan is unbuildable as written.

### CRIT-2 (FAIL): D1 — multi_test.go call-site count undercounted in evidence trail

Planner's evidence trail asserts "4 test functions in internal/templates/multi_test.go" call `SaveSubstrateFile`. Actual count: 5 test functions, but more critically **8 textual call sites** (TestSaveSubstrateFile_FileShapedSuccess alone has 2 calls at lines 406, 425; TestSaveSubstrateFile_ConflictWithoutOverwrite has 3 calls at lines 525, 530, 543).

Every textual call site must add a `projectPath` argument under D1's signature change. The droplet still fits within LOC budget (~16-18 LOC total D1 diff), but the planner's evidence trail mis-represents the change surface. Build-QA would catch this trivially; the FAIL here is on PLANNING ACCURACY, not budget violation.

## Attack Vectors

### Atomicity measurement (PASS)
- D1: 2 distinct production symbols (installConfig + SaveSubstrateFile), 1 production file (templates.go), ~10 LOC prod + ~8 LOC test = ~18 LOC. ON-BUDGET.
- D2: 1-2 distinct production symbols (runTemplateSaveSubstrate; closure mod inside newTemplateSaveCmd is trivial), 1 production file (template_cmd.go), <20 LOC. ON-BUDGET.
- Both droplets sit AT or below the 2-symbol/1-file/sub-80-LOC budget. Atomicity is not the failure mode.

### Hidden install.Apply consumer (MITIGATED)
Hylla `hylla_node_full` on `internal/install.Apply` confirmed 10 callers, ALL tests in `install_test.go`. No cmd/ta production caller. Planner's out-of-scope justification holds.

### init_cmd.go blind spot (MITIGATED)
Read of init_cmd.go full body (985 lines). Verified: NO call to `installconfig.Defaults`, `installconfig.LoadMerged`, or `install.Apply` from any function in init_cmd.go. `resolveInitTarget` does use `resolveCLIPath`, but init's `--path` flag IS the project path (registered via `addPathFlag` at line 167). The flag-collision attack vector is L2-B-D2-specific, not init.

### Seam TODO hunt (MITIGATED)
Hylla `important_comments` field on `SaveSubstrateFile`, `installConfig`, `runTemplateSaveSubstrate`: only `note`-type comments documenting normal flow. No TODO/DEFERRED/follow-up markers in any seam body.

### Signature cascade — SaveSubstrateFile (MITIGATED with caveat)
Hylla refs_find inbound on `SaveSubstrateFile`: 5 callers total (1 prod `runTemplateSaveSubstrate` in cmd/ta/template_cmd.go + 4 distinct test functions in internal/templates/multi_test.go). ALL callers sit within D1+D2's `paths` field. CAVEAT: 4 test FUNCTIONS but 8 textual CALL SITES — see CRIT-2.

### D2 projectPath derivation (FAIL — see CRIT-1)
`resolveCLIPath` EXISTS at `cmd/ta/path.go` (Hylla node_full confirmed). Returns `(string, error)`. BUT the function reads the flag NAMED `--path`, which the substrate save command repurposes as source-file path. See CRIT-1.

### LoadMerged argument type (MITIGATED)
L2-A planner record drop_017.drop.planner_l2_installconfig_override_loaders verified: `LoadMerged(projectPath string) (*Config, error)`. Argument type is `string`. D1's call `installconfig.LoadMerged(projectPath)` where `projectPath string` matches.

### Test signature changes (FAIL — see CRIT-2)
More call sites than the planner enumerated. Compile-fail risk is contained, but the evidence trail is wrong on counts.

### Family check on resolveCLIPath (FAIL — see CRIT-1)
The existing pattern (init_cmd.go) uses `addPathFlag` to register the `--path` flag with PROJECT-path semantics. Substrate-save doesn't follow this pattern — its `--path` flag has SOURCE-FILE semantics. The pattern collision is the load-bearing failure.

## NITs

- Planner's claimed test-caller count (4 functions) is technically TRUE at function granularity; the textual call-site count is 8. Either is fine to report, but the diff implication (how many LOC must change in tests) needs the 8-call-site number to be honest.
- The L2 planner's `paths` field includes `cmd/ta/install_cmd.go` which DOES NOT EXIST. Planner correctly notes this in `description` ("If a `cmd/ta/install_cmd.go` path is still absent, builders must target the actual current command file(s)") — flagged but not a FAIL.
- The planner's hylla feedback mentions `Attribute content is not indexed with type term` errors. Same errors observed in this falsification run; the workaround is `hylla_node_full` by id (reliable when the package structure is known).

## Open Questions

1. **Should `newTemplateSaveCmd`'s `--path` flag be renamed (user-facing change)?** Or should substrate-save get a separate `--project-path` flag? Either choice cascades into doc + help-text changes. Needs root-drop sign-off.
2. **Is the substrate save command supposed to read `<cwd>/.ta/install.toml` by default (no --path needed for project context)?** Defaulting to cwd via `os.Getwd()` directly (skipping `resolveCLIPath`) is the simplest fix and aligns with how `runTemplateSave` (schema-kind) at line 619 already handles cwd. This would also make the planner's "tests don't pass --path, so cwd resolves" claim ACTUALLY TRUE (because there'd be no flag at all).
3. **Does the L1 install_toml_overlays root spec require user-configurable `--path` on substrate save, or is project-context discovery from cwd sufficient?** The root spec's def-of-complete #4 says "cmd/ta/template_cmd.go and cmd/ta/install_cmd.go use LoadMerged" — doesn't pin the flag mechanism.

## Hylla Feedback

Query: `hylla_search_keyword query="SaveSubstrateFile" fields=["content","summary","docstring"]` and variants.
Missed because: keyword backend returns `Attribute <field> is not indexed with type term` for every field combination tried (content/summary/docstring/default). Identical issue reported by L2-A and L2-B planners — keyword-search index is offline for fields-based queries.
Worked via: `hylla_node_full` by full node id (`github.com/evanmschultz/ta/internal/templates/SaveSubstrateFile`). Returned full content + caller list + caller positions. Reliable when the package structure is already known.
Suggestion: Bring the keyword index back online for at least the `default` field; OR document which fields/types are searchable; OR add a clear "keyword search is offline; use node_full by id" hint in the error path.

Query: `hylla_refs_find direction=inbound node_id=github.com/evanmschultz/ta/internal/install.Apply`.
Result: returned empty `data.root: []` — but `hylla_node_full` on the same id returned the full caller list. Inconsistency: refs_find APPARENTLY did not find inbound refs that node_full's `callers` field DID surface. Workaround was node_full.
Suggestion: refs_find should return the same caller set node_full's `callers` field reports; the discrepancy obscures the planner's hidden-consumer audit.

Query: HEAD vs snapshot gap. Local HEAD is `7a589af`; Hylla snapshot 19 is `dbeafca`. The missing commit (`7a589af`) only touches `internal/install/applyRegistrations` — not in L2-B's attack surface. Hylla snapshot is sufficient for this verdict, but for any future drop_017 work that touches `applyRegistrations` directly, re-ingest first.

## Tools Used

- mcp__ta__get (2 calls): read 5 cascade records + drop_017 root + L2-A planner
- mcp__ta__search (1 call): list L2-A builder droplets to verify LoadMerged signature
- mcp__ta__list_sections (2 calls): scope enumeration for drop_017 (returned empty — substrate is per-file-not-record)
