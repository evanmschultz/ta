- `Apply` now calls `applyRegistrations(&rep, name, sub, projectRoot)`.
- `applyRegistrations` groups by directive `settingsFile`, resolves non-absolute directive values with `filepath.Join(projectRoot, settingsFile)`, and uses `resolvedPath` for both `captureSettingsState` and `ApplyRegistrations`.
- `RegistrationOutcome.SettingsFile` still carries the directive value, not the resolved filesystem path.
- Error and success outcome commands both use `filepath.ToSlash(filepath.Join(sub.Destination, reg.SourceFile))`.
- The two resolution-relevant D4 integration tests now use relative `.claude/settings.local.json` directive values and verify/pres seed the resolved `projectRoot/.claude/settings.local.json` path. The error-path test remains absolute by D5 discretion and continues to exercise error outcome handling.
