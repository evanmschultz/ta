- Windows-style `C:\\...` on non-Windows: accepted risk. Go `filepath.IsAbs` is OS-specific, so on Unix this is treated as relative and joined under `projectRoot`. On Windows it is absolute. This does not reintroduce the original Unix/macOS cwd-relative leak for shipped defaults.
- Absolute settings paths: accepted by existing contract. They intentionally bypass projectRoot resolution.

