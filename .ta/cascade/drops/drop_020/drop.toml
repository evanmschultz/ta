[seed_library_init_defaults]
acceptance_criteria = "1. Seed content quality: each seed is a real working example, not just a placeholder. Acceptable examples: a useful PreToolUse git-commit-style guard hook (sanitized from ta own); a starter skill bundle with proper SKILL.md frontmatter; generic non-ta-specific agent personas like code-reviewer + qa-proof; sample CLAUDE.md fragment with be-concise rules; sample settings.local.json fragment showing JSON-merge shape; sample .mcp.json fragment as commented placeholder. 2. Total seed size <500KB embedded. 3. ta init-defaults is safe on a fresh machine (no ~/.ta yet) — creates ~/.ta + subdirs as needed. 4. Interactive flow shows what would be copied per substrate (file count + sample names) before asking Y/N. 5. JSON output (--json) reports per-substrate outcome (added, skipped, error). 6. Seed content avoids ta-internal references (no drop_NNN ids, no cascade methodology specifics, no project-specific paths)."
created_at = "2026-05-24T06:00:00Z"
definition_of_complete = "1. internal/installconfig/seeds/<substrate>/<file> contains opinionated useful starter content for the 10 substrates. 2. Seeds are embedded via //go:embed and exposed via installconfig.SeedFS(substrateName) -> fs.FS. 3. New cmd/ta init_defaults_cmd.go implements ta init-defaults [--interactive | --all | --none] [--overwrite] [--substrate=<name>]. 4. Per-file skip-if-exists unless --overwrite. 5. magefile.go gains InstallNoSeeds target; existing Install adds the init-defaults step at the end (interactive). 6. Tests: seed FS walk; per-substrate file count + non-empty assertion; init-defaults idempotency; --all flag bypass; --none flag bypass. 7. mage check green; CI green. 8. README updated with the bundled-seeds story."
drop_number = 20.0
labels = ["seed-library", "init-defaults", "mage-install", "v01-followup"]
objective = "Ship opinionated useful starter content for the 10 substrates currently lacking embed sources (claude_hooks, claude_skills, claude_agents [generic personas], claude_output_styles, claude_md_fragments, claude_settings_fragments, claude_mcp_servers, codex_agents, codex_config_fragments, codex_mcp_servers, agents_md). Seeds live under internal/installconfig/seeds/<substrate>/<file> embedded via //go:embed all:seeds. New ta init-defaults --interactive command walks the embedded seeds and asks per-substrate whether to install into ~/.ta/<dir>/. Per-file idempotency (skip-if-exists unless --overwrite). New mage installNoSeeds target. Existing mage install gains a final step: invoke ./bin/ta init-defaults --interactive (default Y, dev can answer --all or --none)."
packages = ["internal/installconfig", "cmd/ta"]
paths = ["internal/installconfig/seeds/**", "internal/installconfig/seeds.go", "internal/installconfig/seeds_test.go", "cmd/ta/init_defaults_cmd.go", "cmd/ta/init_defaults_cmd_test.go", "magefile.go", "README.md"]
role = "planner"
state = "todo"
structural_type = "drop"
title = "shipped seed library + ta init-defaults opt-in install"
