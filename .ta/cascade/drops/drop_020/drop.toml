## Plan-QA Falsification Verdict (L1)

**verdict: FAIL** — two concrete counterexamples on Axis 2 (scope coverage) + Axis 4 (Rule 3.5 family / hidden infrastructure dependency). One additional concern survives to NIT.

### 1. Attack vectors tried

- Axis 1 atomicity MEASUREMENT (C1+C2 + sub-planner designation) — MITIGATED (see §2).
- Axis 2 scope coverage (AC + DoC bullets vs children) — **FAILURE** (substrate undercounting, see §3.1).
- Axis 3 symbol grounding (Rule 3.5 family check on NEW symbols) — MITIGATED (see §4).
- Axis 4 seam TODO hunt + hidden infrastructure (Rule 3.5) — **FAILURE** (AC#3 `~/.ta` creation seam unspecified, see §3.2).
- Axis 5 blocker-graph soundness — MITIGATED (see §5).
- Axis 6 drop_004 / installable-substrate overlap — MITIGATED (see §6).
- Axis 7 substrate-count drift (10 vs 11 vs reality) — folded into Axis 2 failure.

### 2. Atomicity measurement

Measured each child against ≤2 production symbols / ≤80 LOC / ≤3 files (CLAUDE.md countable-blocks rule):

- **C1 droplet_l1_mage_no_seeds_install — ATOMIC OK.** New `InstallNoSeeds()` (1 block, new top-level func) + cohesive edit cluster on existing `Install()` body to append the `exec.Command(rep.BinaryPath, "init-defaults", "--interactive")` step (1 block, same-purpose edit). 2 blocks total, 1 file (`magefile.go`), projected ~25 LOC. Confirmed against the actual `Install()` body at lines 56-69 (currently `_, err = install_hygiene.Run(...)` → must capture `rep` to read `rep.BinaryPath`). Within budget.
- **C2 droplet_l1_readme_seeds_story — ATOMIC OK.** 0 production symbols, 1 file (`README.md`), 2 sections (`## Install` paragraph + new `## Starter library` heading), ≤30 LOC. Within budget.
- **L1-A planner_l1_seed_content — correctly designated SEGMENT.** Its preview names A1a (7 substrates of content), A1b (4 substrates), A2 (2 Go symbols across 2 files). The L1 plan's tag `(droplet)` on A1a is wishful — 7 substrate-content directories meeting AC#1 quality bar (working hook script, skill bundle with SKILL.md frontmatter, agent personas, CLAUDE.md fragment, settings fragment, .mcp.json fragment, output-style .md) will EASILY exceed 80 LOC of new content. **The sub-planner L1-A will be forced to re-split A1a at L2 — that is correct cascade behavior, so L1 itself is not a FAIL on this axis.** Filed as NIT N4 below.
- **L1-B planner_l1_init_defaults_cmd — correctly designated SEGMENT.** Preview names B1 (2 symbols), B2 (2 symbols), B3 (tests). B2's scope (interactive prompts + per-substrate file enumeration + sample names + Y/N input handling + JSON output + skip-if-exists) is plausible at 2 symbols only if everything is inlined into `runInitDefaults` — likely over-budget at build time. The sub-planner L2 will re-split. Filed as NIT N5.

### 3. FAILURES

#### 3.1 Axis 2 — substrate undercount (scope-coverage gap)

**Counterexample.** `internal/installconfig/defaults.toml` ships 14 substrates: `claude_agents`, `claude_hooks`, `claude_skills`, `claude_output_styles`, **`claude_plugins`**, `claude_settings_fragments`, `claude_md_fragments`, `claude_mcp_servers`, `codex_agents`, `codex_config_fragments`, `codex_mcp_servers`, `agents_md`, `example_thariq`, `example_stil`. Confirmed by reading defaults.toml (1-164) at HEAD `7a589af`. (defaults.go header comment is stale: it claims `12 substrates` for the 14-substrate file — pre-existing drift, not a drop_020 defect, but it misled the planner.)

The 2 `example_*` substrates already have embed sources via the root `embed.go all:examples` tree. Substrates needing fresh seeds = 14 − 2 = **12**, NOT the 10 the root objective claims, NOT the 11 the L1-A spec + root acceptance criteria enumerate.

Specific missing substrate: **`claude_plugins`** (defaults.toml lines 71-73: `source = "~/.ta/plugins", destination = ".claude/plugins"`). Neither the root drop's enumeration nor L1-A A1a's list contains `claude_plugins`. AC#1 (`each seed is a real working example`) cannot be met for `claude_plugins` if no droplet covers it.

**Impact.** Without amendment, drop_020 lands a partial seed library — running `ta init-defaults` on a fresh machine would silently skip `claude_plugins`, breaking the AC#1 invariant for that substrate.

**Routes to fix.** (a) Root objective + AC #1 + L1-A spec must enumerate 12 substrates including `claude_plugins`. OR (b) explicitly call out `claude_plugins` as an accepted-omission with a sibling drop covering it.

#### 3.2 Axis 4 — AC#3 unspecified seam (Rule 3.5 hidden-infrastructure)

**Counterexample.** AC#3 requires: `ta init-defaults is safe on a fresh machine (no ~/.ta yet) — creates ~/.ta + subdirs as needed.`

The L1-B spec for B2 names `runInitDefaults(out, errOut io.Writer, f initDefaultsFlags) error` + `copySubstrateSeed(seedFS fs.FS, destDir string, overwrite bool) (added, skipped int, err error)`. **Neither symbol is spec'd to create `~/.ta` or the per-substrate subdirs.**

Fresh-machine call path of standalone `ta init-defaults` (no prior `mage install`):
1. Dev installs the `ta` binary some other way (e.g. `go install` to GOBIN).
2. Dev runs `ta init-defaults --all` cold.
3. `runInitDefaults` iterates substrates, calls `copySubstrateSeed(seedFS, destDir, overwrite)` where `destDir = filepath.Join(home, ".ta", "<sub>")`.
4. **`~/.ta` does not exist. `os.WriteFile` inside `copySubstrateSeed` fails with `ENOENT` because the parent dir isn't created.**

The existing `install_hygiene.SeedHomeSchema` (internal/install_hygiene/install_hygiene.go:245-336) DOES `os.MkdirAll(taDir, 0o755)` — but only when called via `install_hygiene.Run`, i.e. from `mage Install`. The init-defaults command, as spec'd, does NOT route through Run. So the `mage install` path works (because Run runs first and creates `~/.ta`), but the standalone `ta init-defaults` path AC#3 explicitly requires DOES NOT.

**Impact.** Without amendment, AC#3 cannot be satisfied. The B2 spec is silent on the seam that creates the home root and per-substrate dirs.

**Routes to fix.** Any of:
- (a) L1-B B2 spec adds `os.MkdirAll(destDir, 0o755)` to `copySubstrateSeed` AND adds `os.MkdirAll(filepath.Join(home, ".ta"), 0o755)` to `runInitDefaults` before the loop. Adds at most a few LOC; B2 stays in budget.
- (b) L1-B introduces a new B0 droplet that calls `install_hygiene.SeedHomeSchema` (or a sibling helper) to ensure home-root before the substrate loop runs.
- (c) L1-B B2 delegates dir-creation to a NEW symbol that the planner must name (in which case symbol count of B2 increases and the sub-planner must re-split).

Whichever is chosen, the L1 plan must name it.

### 4. Symbol grounding (Rule 3.5 family check)

No new failures. Verified at HEAD `7a589af` via Hylla vector search + direct file Read:
- NEW symbols correctly absent from committed tree: `seedsFS`, `SeedFS`, `initDefaultsFlags`, `newInitDefaultsCmd`, `runInitDefaults`, `copySubstrateSeed`, `InstallNoSeeds`. No false existence claims.
- EXISTING anchors confirmed: `install_hygiene.Run` (internal/install_hygiene/install_hygiene.go:155), `install_hygiene.Report.BinaryPath` (struct field at install_hygiene.go:117, docstring `Always populated`), `magefile.Install` (magefile.go:56-69), `cmd/ta/main.go cmd.AddCommand(...)` (lines 106-119), `installconfig.Defaults()` (internal/installconfig/defaults.go:23), `installconfig.Config` (config.go:13).
- The C1 plan's load-bearing claim — `binaryPath from the returned Report` — is grounded: `Report.BinaryPath` is set at install_hygiene.go:195 (`seedRep.BinaryPath = binaryPath`) and the docstring confirms it is always populated.

No `TODO` / `DEFERRED` / `follow-up` / `FIXME` / `not yet` markers in the seams I read (magefile.go full 391 LOC, install_hygiene.go full 352 LOC, cmd/ta/main.go full 324 LOC, installconfig/defaults.go 25 LOC, installconfig/config.go 55 LOC).

### 5. Blocker graph

- L1-A blockers=[] — correct, content + new API has no dep.
- L1-B blockers=[] — correct, planner-level decomposition can proceed against L1-A's spec'd `SeedFS` shape; build-time dep handled inside L1-B at B2.
- C1 blockers=[L1-B, L1-A] — correct, `mage Install` can't exec a nonexistent command, and the binary must embed the seeds for the exec to have effect.
- C2 blockers=[] — acceptable. Doc work parallel to build is sound. Mild risk: if the README ships citing `mage installNoSeeds`/`ta init-defaults --all` before C1 lands, the doc and code are temporarily out of sync — but the SPEC is recorded so the README is authoring against the contract, not vapor. Mitigated.

No over-blocking, no under-blocking on this axis.

### 6. drop_004 overlap (Axis 6)

No conflict. drop_004 shipped the `installconfig` package + `defaults.toml` + the install engine that walks `~/.ta/<dir>` content. drop_020 fills the `seeds` SOURCE side that drop_004 left empty (defaults.toml header comment: `Source paths point at ~/.ta/<name> — the dotta tree the install engine walks at apply time` — but no shipping path populates `~/.ta/<name>` from the binary). drop_020 closes that loop. No symbol or file overlap with the drop_018 D5 fix at `7a589af` either (D5 modified `internal/install/install.go`, absent from drop_020's `paths` slice).

### NITs

- **N4** (carries from atomicity discussion): L1-A's preview tags A1a `(droplet)` but A1a's stated scope (7 substrates × AC#1 quality-bar content) almost certainly exceeds the 80-LOC content budget. The L1-A sub-planner will need to re-split A1a per-substrate (or per-cluster). L1-A is correctly designated SEGMENT, so this re-decomposition is the L2 plan-QA's job; flagging for visibility.
