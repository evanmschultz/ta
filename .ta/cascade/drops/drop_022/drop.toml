[init_defaults_alongside_flag]
acceptance_criteria = "1. --alongside flag handler added to init-defaults command. 2. When --alongside is set AND a file already exists at the destination: write new default to <destination>.new (sibling file). 3. Existing skip-if-exists (default) + --overwrite (force-replace) semantics preserved. 4. --alongside is mutually-exclusive with --overwrite (one or the other; both = error). 5. --alongside compatible with --interactive (interactive prompt can offer alongside as a per-file/per-substrate choice). 6. JSON output (--json) reports outcome status 'alongside' when a .new sibling is written. 7. Tests cover: file-exists + --alongside → .new sibling written; file-absent + --alongside → normal write (no .new suffix); file-exists + neither --alongside nor --overwrite → skipped (default); --alongside + --overwrite → error."
created_at = "2026-05-27T06:00:00Z"
definition_of_complete = "1. cmd/ta/init_defaults_cmd.go gains --alongside flag handler. 2. copySubstrateSeed (or equivalent helper) gains alongside mode. 3. Tests added covering all 4 cases in AC#7. 4. README documents the 3-mode flow. 5. mage check green; CI green."
