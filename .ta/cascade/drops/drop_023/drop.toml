[ta_action_gate_hardening]
acceptance_criteria = "1. _bash_write_vector regex updated to NOT false-positive when 'install' / 'cp' / 'mv' / 'ln' / 'rm' / 'chmod' / etc appear inside path components (i.e. preceded by / AND followed by / or .). 2. Hook gains hardcoded baseline _raw_go_tooling denying go test/vet/build/run/install/get/mod/work/tool/generate, gofmt/gofumpt for ALL scoped agents (independent of bash_deny; mirror the _git_mutation baseline pattern). 3. Existing legitimate uses (cp src dst, install -m 0755, mage targets) still pass the gate. 4. Tests cover the false-positive cases (internal/install/install.go in git diff arg, mage testFunc with internal/install path) + the new baseline denies + the existing legitimate uses. 5. Empirical re-verification: re-dispatch a probe builder against an internal/install/* path and confirm mage commands + git diff are no longer denied."
created_at = "2026-05-27T06:00:00Z"
definition_of_complete = "1. .claude/hooks/ta_action_gate.py edits to _bash_write_vector + new _raw_go_tooling baseline. 2. .claude/hooks/test_ta_action_gate.py (or equivalent) tests for both fixes. 3. mage check green. 4. Probe-scoped-agent dispatch (or equivalent integration test) verifies legitimate read-only commands against internal/install/* pass + raw `go build` is denied. 5. CI green."
