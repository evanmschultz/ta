labels = ["hook-discipline", "bug-fix", "tech-debt", "2026-05-27-discipline-followon"]
objective = "Fix two known hook bugs surfaced during drop_018 D5 build (2026-05-27): (1) _bash_write_vector regex matches bare command 'install' but also falsely fires when 'install' (or cp/mv/ln/etc) appears inside path components like internal/install/install.go — denies legitimate read-only commands (mage testFunc, git diff, grep) that reference those paths. (2) Hook has no hardcoded no-raw-go-tooling baseline; currently relies on per-dispatch bash_deny to block raw go test/vet/build/run/install/get/mod/gofmt/gofumpt — an orchestrator that forgets to list these in bash_deny can let an agent through. Per CLAUDE.md '2026-05-27 Subagent Discipline Update' line 12: 'Builders ... NEVER `mage test-pkg`, `mage ci`, `mage build`, raw `go test`/`go build`/`go vet`, `gofmt`/`gofumpt`, `go list`.'"
