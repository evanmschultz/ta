[notes]
description = 'freeform notes'
paths = ['notes.toml']

[notes.note]
description = 'a freeform journal note'

[notes.note.fields]
[notes.note.fields.body]
description = 'freeform writeup; markdown supported'
format = 'markdown'
type = 'string'

[notes.note.fields.tags]
description = 'optional tag list (each entry a free-form string)'
type = 'array'

[notes.note.fields.title]
description = 'one-line headline'
required = true
type = 'string'

[plans]
description = 'task tracker'
paths = ['plans.toml']

[plans.task]
description = 'a unit of work'

[plans.task.fields]
[plans.task.fields.id]
description = 'stable identifier'
required = true
type = 'string'

[plans.task.fields.status]
description = 'current state'
enum = ['todo', 'doing', 'done']
required = true
type = 'string'

[plans.task.fields.title]
description = 'one-line summary'
required = true
type = 'string'
