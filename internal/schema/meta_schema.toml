# ============================================================================
# ta_schema — the meta-schema: a self-describing record of the schema
# language. Surfaced via `schema(action="get", scope="ta_schema")`. Each
# `kind` below (db, type, field) corresponds to one of the three addressable
# shapes `schema(action="create"|"update"|"delete")` accepts; its `data`
# payload must match the fields declared here.
#
# The meta-schema itself is stored as a single-instance TOML db at
# .ta/meta_schema.toml — conceptually. In practice the literal is embedded
# in the ta binary and never resolved from disk.
#
# Per F10 (PLAN §12.17.9): db format is INFERRED from the file extension
# on each `paths` entry; `format` is NOT a declared meta-field on `[<db>]`.
# Collection mounts (trailing `/`, `.`) are rejected; use globs instead
# (e.g. `docs/*.md`).
# ============================================================================

[ta_schema]
paths = ["ta_schema.toml"]
description = "Meta-schema: the three kinds (db, type, field) an agent constructs via the `schema` tool, and the meta-schema rules enforced on `schema.toml` at load time."

# ----------------------------------------------------------------------------
# kind = "db" — the data shape of `schema(action="create"|"update", kind="db",
# name="<db>", data=...)`. `paths` is required (length 1+); `description` is
# recommended. Per F10 the `format` field is gone — format is inferred from
# the file extension on each path.
# ----------------------------------------------------------------------------
[ta_schema.db]
description = "A database. Mounted at one or more on-disk paths via the `paths` slice; each entry is project-relative or home-relative (`~/...`). Glob `*` is allowed for one segment per entry. Format is inferred from the file extension."

[ta_schema.db.fields.paths]
type = "array"
required = true
description = "Mount paths (length 1+). Each entry must have a recognized file extension (.toml or .md); all entries in one db must share the same extension. Examples: ['plans.toml'], ['workflow/*/db.toml'], ['docs/*.md'], ['~/.ta/projects/myproj/workflow/*/db.toml']. Trailing-slash collection mounts and the `.` project-root mount are not supported. Paths must not overlap with any other db's paths slice."

[ta_schema.db.fields.description]
type = "string"
format = "markdown"
description = "Human-readable description of the db. Surfaced through the `schema` tool; recommended but not required."

# ----------------------------------------------------------------------------
# kind = "type" — the data shape of `schema(action="create"|"update",
# kind="type", name="<db>.<type>", data=...)`. `description` required;
# `heading` required when the owning db's inferred format is "md".
# ----------------------------------------------------------------------------
[ta_schema.type]
description = "A record type under a db. Corresponds to one [<db>.<type>] sub-table."

[ta_schema.type.fields.description]
type = "string"
required = true
format = "markdown"
description = "Human-readable description of the type. Surfaced through the `schema` tool."

[ta_schema.type.fields.heading]
type = "integer"
enum = [1, 2, 3, 4, 5, 6]
description = "MD-only: the ATX heading level (1..6) this type's records occupy. Required when the owning db's inferred format is 'md'; must be absent when format is 'toml'. Each heading level must be unique within a given MD db."

[ta_schema.type.fields.extends]
type = "string"
description = "Optional name of a base ([<db>.bases.<name>]) whose fields this type inherits. Bases-only target — concrete record types are not extensible. The base's fields are merged into the type at load time; same-named child fields wholesale replace the base's declarations. The keyword is discarded after flattening; the Registry carries only the fully-resolved field set."

[ta_schema.type.fields.auto_spawn]
type = "table"
description = "Optional. Declares child records that fire automatically after a successful Create of a record of this type. Shape: `[<db>.<type>.auto_spawn]` with `on_create = [...]` whose entries each carry `type` (db-qualified target), `id_template` (id literal with `{parent_id}` / `{index}` interpolation tokens), and optional `fields` (static field values, strings interpolated through the same two-token rule). Bases may also declare auto_spawn; the rule propagates onto inheriting concrete types and a concrete type's own block wholesale-replaces the inherited one. Cycles, unknown target types, malformed templates, and incomplete payloads are rejected at load. Per F23."

[ta_schema.type.fields.record_per]
type = "string"
enum = ["section", "file"]
description = "MD-only: per-record granularity. \"section\" (default) chops one file into many records via ATX heading boundaries. \"file\" (file-as-record) treats the whole file as one record with YAML frontmatter holding the typed fields and the body holding the markdown content under `body_field`. Forbidden on TOML dbs. A single db cannot mix \"section\" and \"file\" types. Per F31."

[ta_schema.type.fields.body_field]
type = "string"
description = "MD-only, file-as-record only: names the field that receives the markdown body. Required when `record_per = \"file\"`; forbidden when `record_per` is unset or \"section\". The named field must be declared in the type's `fields` map. Per F31."

# ----------------------------------------------------------------------------
# kind = "base" — the data shape of `schema(action="create"|"update",
# kind="base", name="<db>.<base>", data=...)`. A base is a reusable field
# bundle declared at [<db>.bases.<name>]; concrete types and other bases
# inherit it via `extends = "<base>"`. Bases live in their own per-db
# table separate from aliases ([<db>.types.<alias>]) and concrete types
# ([<db>.<type>]); a name may not appear simultaneously as a base and an
# alias. A base must declare at least one field of its own OR an
# `extends` pointing at another base; an empty body is rejected. Cycles
# (A → B → A or self-reference) are rejected at load.
# ----------------------------------------------------------------------------
[ta_schema.base]
description = "A reusable field bundle declared at [<db>.bases.<name>]. Concrete record types and other bases inherit it via `extends`. Bases live in their own per-db table; the namespace is Registry-wide so any db can extend a base declared in any other db. Bases are flattened into their inheritors at load time and the `extends` keyword is then discarded — the Registry carries only the resolved field sets on concrete types."

[ta_schema.base.fields.description]
type = "string"
format = "markdown"
description = "Human-readable description of the base. Surfaced through the `schema` tool; documentation only — bases never appear as concrete record types in the resolved Registry."

[ta_schema.base.fields.extends]
type = "string"
description = "Optional name of another base whose fields this base inherits. Forms a chain (A extends B extends C); cycles are rejected at load. A base without `extends` is the root of an inheritance chain."

[ta_schema.base.fields.auto_spawn]
type = "table"
description = "Optional. Same shape as on a concrete type — declares spawn specs that propagate onto every inheriting concrete type that does not declare its own auto_spawn. Per F23."

# ----------------------------------------------------------------------------
# kind = "field" — the data shape of `schema(action="create"|"update",
# kind="field", name="<db>.<type>.<field>", data=...)`. `type` required;
# everything else optional.
# ----------------------------------------------------------------------------
[ta_schema.field]
description = "A field on a record type. Corresponds to one [<db>.<type>.fields.<name>] sub-table."

[ta_schema.field.fields.type]
type = "string"
required = true
enum = ["string", "integer", "float", "boolean", "datetime", "array", "table"]
description = "Declared field type. Matches TOML's native types."

[ta_schema.field.fields.required]
type = "boolean"
default = false
description = "Whether the field must be present in a valid record. Defaults to false."

[ta_schema.field.fields.description]
type = "string"
format = "markdown"
description = "Human-readable description of the field. Surfaced verbatim in validation failures."

[ta_schema.field.fields.enum]
type = "array"
description = "Optional allowed-value list. Values must match `type`."

[ta_schema.field.fields.default]
type = "string"
description = "Optional default value. Not applied during validation; informational only."

[ta_schema.field.fields.format]
type = "string"
description = "Optional format hint (e.g. 'markdown'). Informational; informs alternate renderers."

[ta_schema.field.fields.element_type]
type = "string"
description = "When type = \"array\", the per-element type. One of the seven primitives (string, integer, float, boolean, datetime, table; \"array\" is reserved and rejected — nested arrays are not supported in v1), or a registered alias name from [<schema>.types.<alias>]. Required when element_fields is present (and must equal the literal \"table\" in that case). Forbidden on non-array fields."

[ta_schema.field.fields.element_fields]
type = "table"
description = "When element_type = \"table\", the per-element field shape. Each sub-key is itself a [field] body (recursive; arbitrary nesting depth). Forbidden when element_type is anything other than \"table\". Required fields inside element_fields apply to every element of the array."

[ta_schema.field.fields.fields]
type = "table"
description = "When type = \"table\", the per-instance field shape declared inline. Each sub-key is itself a [field] body (recursive; arbitrary nesting depth). Forbidden when type is anything other than \"table\". Required fields inside `fields` apply to the single nested table value (not per-element — element_fields covers arrays of tables). Aliases (element_type = \"<alias>\") are not supported on the outer field; alias references go through element_type chains for arrays only."

# ----------------------------------------------------------------------------
# Aliases — reusable record-shape declarations under [<schema>.types.<alias>].
# At load time, every alias body (description + fields map, same shape as
# a record type) is parsed and stashed in a Registry-wide alias table.
# Fields that set element_type = "<alias>" are inlined with the alias's
# resolved fields before validation runs. Visibility is Registry-wide
# (every db in the loaded schema), so one db can declare a shape and
# another db reference it. Aliases must not shadow the seven primitive
# type names (string, integer, float, boolean, datetime, array, table);
# cycles (A → B → A or self-reference) are rejected at load. Aliases do
# NOT support `extends` — composition for aliases happens via element_type
# chains; bases use `extends`.
# ----------------------------------------------------------------------------
[ta_schema.types]
description = "Optional table of named record-shape aliases declared at [<schema>.types.<alias>]. Each alias is a record-type-shaped body (description + fields map) reusable via element_type = \"<alias>\". Aliases must not shadow primitives; cycles are rejected at load. Aliases do not support `extends`."

# ----------------------------------------------------------------------------
# Bases — reusable field bundles declared under [<schema>.bases.<name>].
# Concrete record types and other bases inherit them via `extends`. Bases
# live in their own per-db table; the namespace is Registry-wide. A name
# may not appear simultaneously as a base and an alias. Bases compose via
# `extends`; aliases compose via element_type — the two mechanisms do not
# cross. Cycles in the extends chain are rejected at load.
# ----------------------------------------------------------------------------
[ta_schema.bases]
description = "Optional table of named bases declared at [<schema>.bases.<name>]. Each base is a reusable field bundle inherited by concrete types or other bases via `extends`. Bases are flattened into their inheritors at load time; `extends` is discarded after flattening. Cycles are rejected at load."
