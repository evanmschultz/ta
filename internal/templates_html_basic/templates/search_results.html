<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Results</title>
<style>
  :root {
    --fg: #111;
    --fg-muted: #555;
    --bg: #fafafa;
    --bg-card: #fff;
    --border: #d6d6d6;
  }
  html { color-scheme: light; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 1rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 64rem;
    margin: 0 auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 1.5rem 1.75rem 2rem;
  }
  header {
    display: grid;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    line-height: 1.25;
  }
  .meta-tag {
    font-size: 0.875rem;
    color: var(--fg-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  ul.results {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.results li {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
  }
  ul.results li:last-child {
    border-bottom: 0;
  }
  ul.results li code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--fg-muted);
    font-size: 0.9rem;
  }
  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--fg-muted);
  }
  @media (max-width: 40rem) {
    body { padding: 0.75rem; }
    main { padding: 1rem; }
  }
</style>
</head>
<body>
<main aria-labelledby="search-title">
  <header>
    <div class="meta-tag">search results</div>
    <h1 id="search-title">Search Results</h1>
  </header>

  <ul class="results">
    {{ range .Results }}
    <li>
      <code>{{ .ID }}</code>
    </li>
    {{ end }}
  </ul>

  <footer>
    Rendered via ta search query. Track A (zero-deps) backend-rendered template.
  </footer>
</main>
</body>
</html>
